name: 构建并发布 Flutter APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'  # 监听所有 v 开头的 tag，如 v1.0.0
  workflow_dispatch:  # 支持手动触发
    inputs:
      version:
        description: '版本号 (如 1.0.0)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: 构建发布版 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建 Release
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 创建 local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: 解码签名密钥
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: 创建 key.properties
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: 获取版本号
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建 Release APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: 重命名 APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/fanqie-v${{ steps.version.outputs.version }}.apk

      - name: 上传 APK 构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-v${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "番茄Reader v${{ steps.version.outputs.version }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          body: |
            ## 番茄Reader v${{ steps.version.outputs.version }}
            
            - 内置后端引擎，免除配置任何后端地址
            - 支持小说搜索、全量多维书库筛选与目录阅读
            - 高速并发下载，支持后台下载与离线缓存
            
            ## 下载安装
            
            - 直接下载下方的 APK 文件安装即可。
          files: |
            build/app/outputs/flutter-apk/fanqie-v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

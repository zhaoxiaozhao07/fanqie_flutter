name: 构建并发布 Flutter APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'  # 监听所有 v 开头的 tag，如 v1.0.0
  workflow_dispatch:  # 支持手动触发
    inputs:
      version:
        description: '版本号 (如 1.0.0)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: 构建发布版 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建 Release
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 创建 local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: 创建 key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: 获取版本号
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建 Release APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: 重命名 APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/fanqie-v${{ steps.version.outputs.version }}.apk

      - name: 上传 APK 构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-v${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "番茄Reader v${{ steps.version.outputs.version }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          body: |
            ## 番茄Reader v${{ steps.version.outputs.version }}
            
            ### 🚀 核心新特性与改进 (v3.0.1)
            - **官方原生段评系统**：直连官方评论接口，正文段落优雅展示评论胶囊气泡，点击滑出段评抽屉
            - **原文引用与定位高亮**：段评顶部保留原文卡片，支持「定位原文」平滑滚动并高亮该段
            - **楼中楼回复与多媒体**：支持展开二级回复、点赞数展示、图片高清查看（自动 WebP 转码）与头衔勋章展示
            - **全书书评与离线自愈**：书籍详情页集成读者书评；已下载离线图书断网时自动回退读取本地段评缓存
            - **零外部服务器架构**：纯 Dart 内置安全签名网关与解密链路，开箱即用
            
            ## 下载安装
            
            - 直接下载下方的 APK 文件安装即可。
          files: |
            build/app/outputs/flutter-apk/fanqie-v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

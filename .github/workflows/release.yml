name: 三平台统一 Release
run-name: Android / Windows / macOS · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '必须与 pubspec 一致；留空自动读取'
        default: ''
        type: string
      publish:
        description: '三平台全部通过后公开同一个 Release（仅 main）；关闭可在分支验证'
        default: true
        type: boolean

permissions:
  contents: read
concurrency:
  group: unified-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      build: ${{ steps.identity.outputs.build }}
      full_version: ${{ steps.identity.outputs.full_version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      publish: ${{ steps.identity.outputs.publish }}
      packages: ${{ steps.identity.outputs.packages }}
      android_artifact: ${{ steps.identity.outputs.android_artifact }}
      combined_artifact: ${{ steps.identity.outputs.combined_artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 冻结同一源码、版本和发布范围
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish || false }}
        run: |
          set -euo pipefail
          python3 scripts/unified_release.py prepare \
            --version "$REQUESTED_VERSION" --publish "$REQUESTED_PUBLISH"

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: 共享离线回归与三端发布阴性门禁
        run: |
          set -euo pipefail
          mkdir -p build/unified/ci-logs
          flutter --version
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter analyze --no-pub 2>&1 | tee build/unified/ci-logs/analyze.log
          flutter test --no-pub --reporter expanded 2>&1 | tee build/unified/ci-logs/flutter-test.log
          python3 scripts/test_unified_release.py 2>&1 | tee build/unified/ci-logs/release-gates.log
          python3 scripts/test_macos_package.py 2>&1 | tee build/unified/ci-logs/package-gates.log
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 scripts/test_unified_workflow.py 2>&1 | tee build/unified/ci-logs/workflow-gates.log
          for script in scripts/*.sh; do bash -n "$script"; done
          git diff --check
      - name: 保存共享质量日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-quality-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/unified/ci-logs/
          if-no-files-found: warn
          retention-days: 14

  android:
    needs: [prepare, quality]
    if: needs.prepare.outputs.packages == 'true'
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      artifact_name: ${{ needs.prepare.outputs.android_artifact }}
    secrets: inherit

  windows:
    needs: [prepare, quality]
    if: needs.prepare.outputs.packages == 'true'
    uses: ./.github/workflows/windows-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish: false
      release_tag: ${{ needs.prepare.outputs.release_tag }}

  macos:
    needs: [prepare, quality]
    if: needs.prepare.outputs.packages == 'true'
    uses: ./.github/workflows/macos-internal.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish: false
      full_platform: true
      reader_aot: true
      require_foreground: false
      live_api: false

  assemble:
    needs: [prepare, quality, android, windows, macos]
    if: needs.prepare.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ needs.prepare.outputs.combined_artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android.outputs.artifact_name }}
          path: dist/clients/android
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.artifact_name }}
          path: dist/clients/windows
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.macos.outputs.artifact_name }}
          path: dist/clients/macos
      - name: 汇总校验同一源码、完整三客户端及原始校验值
        run: |
          set -euo pipefail
          python3 scripts/unified_release.py assemble \
            --android dist/clients/android --windows dist/clients/windows \
            --macos dist/clients/macos --output dist/release-ci
          python3 scripts/unified_release.py verify dist/release-ci
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.combined_artifact }}
          path: dist/release-ci/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, quality, android, windows, macos, assemble]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.assemble.outputs.artifact_name }}
          path: dist/release
      - name: 再次校验后创建完整 draft，上传复验所有附件才公开
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/unified_release.py verify dist/release
          python3 scripts/unified_release.py publish dist/release --notes docs/RELEASE_NOTES.md

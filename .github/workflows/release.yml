name: 构建并发布 Flutter APK

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本（须与 pubspec.yaml 一致，如 3.3.0）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: reader-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: 构建发布版 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: 校验版本与发布目标
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          VERSION=${FULL_VERSION%%+*}
          BUILD=${FULL_VERSION##*+}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD" =~ ^[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "$VERSION" ]] || { echo '标签与代码版本不一致'; exit 1; }
          fi
          if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "$VERSION" ]]; then
            echo '手动版本与代码版本不一致'; exit 1
          fi
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then PUBLISH=true; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: 创建 local.properties
        run: |
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
      - name: 配置发布签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: 构建 Release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      - name: 命名产物并计算校验值
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk "fanqie-v$VERSION.apk"
          sha256sum "fanqie-v$VERSION.apk" > "fanqie-v$VERSION.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: fanqie-v${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/fanqie-v*.*
          retention-days: 30
      - name: 创建 GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          name: 番茄Reader v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            build/app/outputs/flutter-apk/fanqie-v${{ steps.version.outputs.version }}.apk
            build/app/outputs/flutter-apk/fanqie-v${{ steps.version.outputs.version }}.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

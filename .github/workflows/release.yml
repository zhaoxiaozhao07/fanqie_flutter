name: 构建并发布 Flutter APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'  # 监听所有 v 开头的 tag，如 v1.0.0
  workflow_dispatch:  # 支持手动触发
    inputs:
      version:
        description: '版本号 (如 1.0.0)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: 构建发布版 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建 Release
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 创建 local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: 创建 key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: 获取版本号
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建 Release APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: 重命名 APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/fanqie-v${{ steps.version.outputs.version }}.apk

      - name: 上传 APK 构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-v${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "番茄Reader v${{ steps.version.outputs.version }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          body: |
            ## 番茄Reader v${{ steps.version.outputs.version }}
            
            ### 🚀 核心新特性与改进 (v3.1.0 - 纯小说阅读全维增强版)
            - **双阅读模式自由切换**：垂直无缝连续滚屏与左右仿真翻页（PageView + 点击热区翻页），畅享纸书手感与单手翻页；
            - **精细排版定制与多字体**：首行缩进(2字符开关)、字间距、段落间距与页边距四维微调；支持系统默认、宋体、楷体、黑体自由切换；
            - **沉浸式自动阅读 / 自动平缓滚屏**：支持 15~100 px/s 速度调节，悬浮胶囊控制条，轻触正文随时暂停与继续；
            - **书签、划线高亮与阅读笔记系统**：顶栏一键书签，段落长按划线与写读后感悟，目录抽屉「目录/书签/笔记」三位一体管理并支持一键定位；
            - **目录正反序与分卷折叠**：支持正序/倒序一键切换，原生分卷折叠展开，自动居中高亮当前阅读章节；
            - **后续 3~5 章静默预加载流水线**：后台静默并发预热，彻底消除翻页骨架屏与 Loading，断网零等待；
            - **连载书籍更新检测与书架红点**：书架下拉自动比对远端连载更新，封面右上角显眼「更新」红点提醒；
            - **本地 TXT / EPUB 小说导入与阅读**：智能正则分章与 EPUB 解构清洗，直接并入书架本地秒开阅读；
            - **听书进阶优化**：睡眠定时新增「读完本章后停止」选项；结束前 1 分钟音量平滑淡出；支持锁屏媒体中心播控联动与耳机线控；
            - **官方原生段评与书评离线自愈**：保留段评气泡、原文引用高亮与楼中楼互动。
            
            ## 下载安装
            
            - 直接下载下方的 APK 文件安装即可。
          files: |
            build/app/outputs/flutter-apk/fanqie-v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

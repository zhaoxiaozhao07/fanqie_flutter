name: 构建 macOS 自用 DMG
run-name: macOS arm64 自用 Release · ${{ github.ref_name }}

# Deliberately independent of the Android release workflow and signing secrets.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本校验（留空使用 pubspec.yaml，不会修改版本号）'
        required: false
        default: ''
        type: string
      publish:
        description: '创建独立的 macOS 自用预发布版本（未公证，不覆盖 Android Release）'
        required: true
        default: true
        type: boolean
      full_platform:
        description: '最终验证：完整 Mac 平台集成（不启用人工保存面板/系统全屏）'
        required: false
        default: false
        type: boolean
      reader_aot:
        description: '最终验证：七场景 AOT Profile（失败保留诊断，不视为验收）'
        required: false
        default: false
        type: boolean
      require_foreground:
        description: 'AOT 必须获得真实前台；无前台的 hosted runner 将失败'
        required: false
        default: false
        type: boolean
      live_api:
        description: '独立 opt-in：有界只读真实 API smoke，不配置凭据'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-internal-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 测试并构建 arm64 Release DMG
    # A standard, non-larger Apple Silicon runner; do not use an Intel label.
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      full_version: ${{ steps.version.outputs.full_version }}
      build: ${{ steps.version.outputs.build }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 校验架构、版本与发布范围
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]] || { echo 'Apple Silicon runner is required'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          FULL_VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          VERSION=${FULL_VERSION%%+*}
          BUILD=${FULL_VERSION##*+}
          [[ "$FULL_VERSION" == *+* && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$BUILD" =~ ^[0-9]+$ ]]
          [[ "$FULL_VERSION" == 3.3.6+342 ]]
          if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "$VERSION" ]]; then
            echo '手动版本与代码版本不一致'; exit 1
          fi
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '仅 main 可发布自用预发布版本；其他分支请关闭 publish'; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "artifact_name=fanqie-macos-arm64-$VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          mkdir -p build/macos/ci-logs
          sw_vers
          xcodebuild -version
          for script in scripts/*.sh; do bash -n "$script"; done
          git diff --check
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          architecture: arm64
          cache: true
      - name: 准备 macOS 依赖
        run: |
          set -euo pipefail
          flutter --version
          flutter config --enable-macos-desktop
          flutter pub get --enforce-lockfile
          flutter --version --machine > build/macos/ci-logs/flutter-version.json
      - name: 原生门禁受控命令回归（不等于 Mac 实机验证）
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 scripts/test_macos_native_pipeline.py \
            2>&1 | tee build/macos/ci-logs/native-pipeline-fixtures.log
      - name: AOT 生命周期回归（Bash 3.2 兼容进程 doubles）
        timeout-minutes: 3
        env:
          BASH_EXECUTABLE: /bin/bash
        run: |
          set -euo pipefail
          python3 scripts/test_macos_reader_performance_pipeline.py \
            2>&1 | tee build/macos/ci-logs/reader-lifecycle-fixtures.log
      - name: 打包与来源受控文件系统回归
        timeout-minutes: 5
        env:
          BASH_EXECUTABLE: /bin/bash
        run: |
          set -euo pipefail
          python3 scripts/test_macos_package.py \
            2>&1 | tee build/macos/ci-logs/package-provenance-fixtures.log
      - name: 静态分析
        run: |
          set -euo pipefail
          flutter analyze --no-pub 2>&1 | tee build/macos/ci-logs/flutter-analyze.log
      - name: 离线单元与组件回归
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee build/macos/ci-logs/flutter-test.log
      - name: 原生 XCTest（生产 Debug 主机）
        timeout-minutes: 15
        run: |
          set -euo pipefail
          scripts/test_macos_native.sh 2>&1 | tee build/macos/ci-logs/native-xctest.log
      - name: 完整平台集成（独立最终验证 opt-in）
        if: inputs.full_platform
        timeout-minutes: 15
        run: |
          set -euo pipefail
          scripts/test_macos_platform.sh \
            --dart-define=MACOS_NATIVE_FULLSCREEN_TEST=false \
            --dart-define=MACOS_SAVE_PANEL_TEST=false \
            2>&1 | tee build/macos/ci-logs/full-platform.log
      - name: 七场景 AOT Profile（独立最终验证 opt-in）
        if: inputs.reader_aot
        timeout-minutes: 12
        env:
          MACOS_REQUIRE_FOREGROUND: ${{ inputs.require_foreground }}
          MACOS_READER_PERF_LOG: ${{ github.workspace }}/build/macos/ci-logs/reader-aot-app.log
        run: |
          set -euo pipefail
          scripts/test_macos_reader_performance.sh \
            2>&1 | tee build/macos/ci-logs/reader-aot-runner.log
      - name: 有界真实 API smoke（独立 opt-in）
        if: inputs.live_api
        timeout-minutes: 8
        run: |
          set -euo pipefail
          flutter test --no-pub test/api_integration_test.dart \
            --dart-define=FANQIE_LIVE_API=true --concurrency=1 --reporter expanded \
            2>&1 | tee build/macos/ci-logs/live-api.log
      - name: 构建生产入口 Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          flutter build macos --release --no-pub --target lib/main.dart \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER" \
            2>&1 | tee build/macos/ci-logs/flutter-build.log
      - name: 内部签名、架构校验与 DMG 打包
        timeout-minutes: 10
        env:
          FULL_VERSION: ${{ steps.version.outputs.full_version }}
        run: |
          set -euo pipefail
          # "internal" is ad-hoc signing of a Release build, not a Debug build.
          export MACOS_XCODE_VERSION="$(xcodebuild -version)"
          python3 scripts/macos_release_validation.py context \
            --sdk build/macos/ci-logs/flutter-version.json \
            --native-log build/macos/ci-logs/native-xctest.log \
            --output build/macos/ci-logs/release-context.json
          export MACOS_RELEASE_CONTEXT="$PWD/build/macos/ci-logs/release-context.json"
          scripts/package_macos.sh \
            build/macos/Build/Products/Release/FanqieReader.app \
            internal build/macos/distribution/ci \
            2>&1 | tee build/macos/ci-logs/package.log
          python3 scripts/macos_release_validation.py artifacts build/macos/distribution/ci
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            build/macos/distribution/ci/*.dmg
            build/macos/distribution/ci/*.dmg.sha256
            build/macos/distribution/ci/build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: 保存验证日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/macos/ci-logs/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: 发布独立的自用预发布附件
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/macos
      - name: 创建 macOS 预发布版本（不覆盖既有标签或附件）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          FULL_VERSION: ${{ needs.build.outputs.full_version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$FULL_VERSION" == 3.3.6+342 ]]
          python3 scripts/macos_release_validation.py artifacts dist/macos
          NAME="fanqie-v$VERSION-$BUILD_NUMBER-macos-arm64-internal.dmg"
          # Separate namespace + immutable run identity; never move Android v* tags.
          TAG="macos-internal-v$VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" > "$WORK/refs.json"
          python3 scripts/macos_release_validation.py tag-absent "$WORK/refs.json"
          {
            printf '# macOS 自用构建\n\n'
            printf '版本：`%s`；生产入口 `lib/main.dart`，Release AOT，Apple Silicon / arm64。\n\n' "$FULL_VERSION"
            printf '**仅供自用：临时 ad-hoc 签名，未使用 Developer ID，未经过 Apple 公证。**\n'
            printf '无需 Apple ID 或额外仓库密钥；不承诺通过 Gatekeeper，首次打开可能需要在系统「隐私与安全性」中允许。\n\n'
            printf '最低构建目标 macOS 12.0，不等于最低系统实机或完整安装升级验收。\n'
            printf '请先校验同名 SHA-256 文件，退出旧实例，再将 DMG 内应用拖到 Applications。\n'
            printf '听书服务地址、模型、音色和 API Key 在应用内配置，Keychain 保存密钥，不属于 CI secrets。\n\n'
            printf '此预发布不修改 Android 正式 Release、APK、正文或版本标签。\n'
            printf '仓库公开，因此预发布附件也公开；包内不包含个人阅读数据或语音密钥。\n\n'
            printf '源码提交：`%s`\n\n[构建与测试日志](%s)；完整来源见附件 `build-info.json`。\n' "$GITHUB_SHA" "$RUN_URL"
          } > "$WORK/release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "番茄Reader macOS 自用 v${VERSION}（构建 ${GITHUB_RUN_NUMBER}）" \
            --notes-file "$WORK/release-notes.md" \
            "dist/macos/$NAME" "dist/macos/$NAME.sha256" dist/macos/build-info.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$WORK/tag.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$WORK/release.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$WORK/download"
          python3 scripts/macos_release_validation.py remote dist/macos "$WORK/download" \
            --tag-json "$WORK/tag.json" --release-json "$WORK/release.json"
          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          {
            printf '## macOS 自用 Release DMG\n\n'
            printf '[下载 DMG 与 SHA-256](%s)\n\n' "$RELEASE_URL"
            printf 'Release 构建；arm64；临时签名；未公证。Android 发布保持不变。\n'
          } >> "$GITHUB_STEP_SUMMARY"

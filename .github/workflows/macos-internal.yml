name: 构建 macOS 自用 DMG
run-name: macOS arm64 自用 Release · ${{ github.ref_name }}

# Reusable native gates; standalone self-use publishing has its own namespace.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本校验（留空使用 pubspec.yaml，不会修改版本号）'
        required: false
        default: ''
        type: string
      publish:
        description: '创建独立的 macOS 自用预发布版本（未公证，不覆盖 Android Release）'
        required: true
        default: true
        type: boolean
      full_platform:
        description: '最终验证：完整 Mac 平台集成（不启用人工保存面板/系统全屏）'
        required: false
        default: false
        type: boolean
      reader_aot:
        description: '最终验证：七场景 AOT Profile（失败保留诊断，不视为验收）'
        required: false
        default: false
        type: boolean
      require_foreground:
        description: 'AOT 必须获得真实前台；无前台的 hosted runner 将失败'
        required: false
        default: false
        type: boolean
      live_api:
        description: '独立 opt-in：有界只读真实 API smoke，不配置凭据'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-internal-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    uses: ./.github/workflows/macos-build.yml
    with:
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
      full_platform: ${{ inputs.full_platform }}
      reader_aot: ${{ inputs.reader_aot }}
      require_foreground: ${{ inputs.require_foreground }}
      live_api: ${{ inputs.live_api }}

  publish:
    name: 发布独立的自用预发布附件
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/macos
      - name: 创建 macOS 预发布版本（不覆盖既有标签或附件）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          FULL_VERSION: ${{ needs.build.outputs.full_version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$(python3 scripts/release_identity.py pubspec.yaml)" == "$FULL_VERSION" ]]
          python3 scripts/macos_release_validation.py artifacts dist/macos
          NAME="fanqie-v$VERSION-$BUILD_NUMBER-macos-arm64-internal.dmg"
          # Separate namespace + immutable run identity; never move Android v* tags.
          TAG="macos-internal-v$VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" > "$WORK/refs.json"
          python3 scripts/macos_release_validation.py tag-absent "$WORK/refs.json"
          {
            printf '# macOS 自用构建\n\n'
            printf '版本：`%s`；生产入口 `lib/main.dart`，Release AOT，Apple Silicon / arm64。\n\n' "$FULL_VERSION"
            printf '**仅供自用：临时 ad-hoc 签名，未使用 Developer ID，未经过 Apple 公证。**\n'
            printf '无需 Apple ID 或额外仓库密钥；不承诺通过 Gatekeeper，首次打开可能需要在系统「隐私与安全性」中允许。\n\n'
            printf '最低构建目标 macOS 12.0，不等于最低系统实机或完整安装升级验收。\n'
            printf '请先校验同名 SHA-256 文件，退出旧实例，再将 DMG 内应用拖到 Applications。\n'
            printf '听书服务地址、模型、音色和 API Key 在应用内配置，Keychain 保存密钥，不属于 CI secrets。\n\n'
            printf '此预发布不修改 Android 正式 Release、APK、正文或版本标签。\n'
            printf '仓库公开，因此预发布附件也公开；包内不包含个人阅读数据或语音密钥。\n\n'
            printf '源码提交：`%s`\n\n[构建与测试日志](%s)；完整来源见附件 `build-info.json`。\n' "$GITHUB_SHA" "$RUN_URL"
          } > "$WORK/release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "番茄Reader macOS 自用 v${VERSION}（构建 ${GITHUB_RUN_NUMBER}）" \
            --notes-file "$WORK/release-notes.md" \
            "dist/macos/$NAME" "dist/macos/$NAME.sha256" dist/macos/build-info.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$WORK/tag.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$WORK/release.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$WORK/download"
          python3 scripts/macos_release_validation.py remote dist/macos "$WORK/download" \
            --tag-json "$WORK/tag.json" --release-json "$WORK/release.json"
          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          {
            printf '## macOS 自用 Release DMG\n\n'
            printf '[下载 DMG 与 SHA-256](%s)\n\n' "$RELEASE_URL"
            printf 'Release 构建；arm64；临时签名；未公证。Android 发布保持不变。\n'
          } >> "$GITHUB_STEP_SUMMARY"
